id: imbalance-1x
title: Check an imbalance verdict and look for added mass
source: "AI-drafted from general vibration-analysis knowledge; to be checked against Randall, R. B. (2011). Vibration-based Condition Monitoring. Wiley."
source_url: null
licence: written for this project; freely reproducible
verification: ai_drafted
drafted_with_ai: true
applies_to: [imbalance]
evidence_required:
  - f_under_radial_o1
  - f_under_radial_ratio_2x_1x
  - f_under_radial_kurtosis
  - speed_hz
excludes: []
steps:
  - Check that the energy really is concentrated at 1× shaft rate and that the 2× to 1× ratio is low. Imbalance is a once-per-revolution force, so a strong 2× component points at misalignment or looseness instead.
  - Check that the signal is smooth rather than impulsive. A low or negative excess kurtosis is consistent with imbalance; a strongly positive value suggests impacts and therefore a different cause.
  - "Inspect the rotor for added, lost or displaced mass: fouling, debris, a missing balance weight, a damaged blade or vane, or moisture collected on one side."
  - Record again at a second shaft speed. The 1× amplitude from a mass imbalance rises steeply with speed, so a component that does not grow with speed is probably not imbalance.
  - Refer the residual imbalance to the balance-quality grade appropriate for the machine type before deciding whether correction is required.
notes: >
  The last step deliberately names no grade or tolerance. Balance quality grades are defined in ISO 21940-11
  and that document has not been read for this project, so no numeric tolerance is stated here. See the
  balance-quality-grades stub.
