notes: >
  Not offered. The evaluation-zone scheme classifies a machine's broadband vibration into bands that
  correspond to newly commissioned, acceptable for continued operation, unsatisfactory, and unacceptable,
  with boundaries that depend on machine class and mounting. The boundaries and the machine-class definitions
  are not stated here because the standard has not been read. A further obstacle: this project reports
  accelerometer amplitudes in volts, while the standard is written for velocity in mm/s, so a calibrated
  conversion would be required before any zone comparison is meaningful. Fill this in from the NUS library
  copy, or delete the entry and say in the report that severity banding is out of scope.
