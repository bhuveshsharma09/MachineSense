# MachineSense base config. Defaults live in ml/config.py; every key here overrides them (unknown keys are rejected).
# Values below were set from data in a notebook: the comment names it. Changing any of them changes the
# preprocess config sha256 and invalidates every cache named by it.
seed: 42

paths:
  # Folder that directly contains normal/, imbalance/, ... Relative to SystemCode/.
  # Override per machine with the MACHINESENSE_DATA_ROOT env var.
  data_root: ../mafaulda
  mlflow_uri: sqlite:///mlruns.db

preprocess:
  speed:
    order_axis: window  # decision 26 Sep 2026: per-window speed from the untouched tachometer
    window_min_intervals: 3  # window_speeds: fewer clean tacho intervals in a window → recording speed
  # Bearing defect frequencies as multiples of shaft rate (orders); the ball defect line is 2 × BSF.
  bearing:
    bpfo: 2.998
    bpfi: 5.002
    bsf: 1.871
    ftf: 0.375

  # Notebook 02: 1.25 × max whole-recording robust z of split_closed TRAIN normal microphones (14.57).
  mic:
    burst_z: 18.2
    # Notebook 02: event-aligned ringing stays > 1.2 × baseline for 15 samples either side of a flagged run.
    burst_pad: 15

  # Fixed band-stop for the ~22,028 Hz line (clean_recording, channels 1–7). Set from split_closed TRAIN NORMAL
  # recordings only: line + ±60/±120 Hz sidebands span 21,899.1–22,166.3 Hz, + 25 Hz margin, rounded to 5 Hz.
  # Linear-phase Kaiser FIR (80 dB, 200 Hz transitions), applied by centred convolution.
  bandstop:
    enabled: true
    stop_lo_hz: 21870.0
    stop_hi_hz: 22195.0
    transition_hz: 200.0
    numtaps: 1257
    window: [kaiser, 7.8573]

  # Notebook 02: spectral kurtosis on train 0 g outer race vs train normal; band ≥ 2 kHz, never below 1 kHz.
  envelope:
    sk:
      widths_hz: [1000.0, 2000.0, 4000.0, 8000.0]
      min_lo_hz: 1000.0
    min_band_hz: 2000.0
    # Rule: ml.features.select_demod_band. Applied per evaluation track → results/demod_bands.json.
    selection:
      channels: [under_radial, over_radial]
      fault_classes: [underhang_outer, overhang_outer]
      severities: [0.0]
      reference_class: normal
      min_recordings: 5
    # PROVISIONAL closed-track bands (split_closed train). Other tracks: results/demod_bands.json.
    # Both lie above the rated ±3 dB range of at least one sensor model; awaiting a decision.
    bands_hz:
      under_radial: [9000.0, 11000.0]
      over_radial: [13000.0, 17000.0]
    bands_provisional: true
    # Healthy-only track: a priori, no recordings used. Inside the ±3 dB range of BOTH sensor models,
    # lower edge at the 1 kHz floor, at least 2 kHz wide.
    healthy_band_hz: [1000.0, 5000.0]
    # Decision 26 Sep 2026: primary envelope band for EVERY track (sensor ratings). bands_hz and
    # results/demod_bands.json are a separately reported comparison only.
    primary_band_hz: [1000.0, 5000.0]
    # Manufacturer ratings; MAFAULDA does not document which model is on which bearing.
    sensors:
      "601A01": {range_3db_hz: [0.27, 10000.0], resonance_hz: 16000.0, source: "PCB/IMI 601A01 spec sheet, Revision G, ECN 14824"}
      "604B31": {range_3db_hz: [0.5, 5000.0], resonance_hz: 10000.0, source: "PCB/IMI 604B31 spec sheet, Revision B, ECN 49214"}
    max_order: 12.0
    order_step: 0.005

  # Envelope-order combs per bearing fault family (orders).
  comb:
    ftf_harmonics: [1, 2, 3, 4, 5]
    bsf_multiple: 2.0
    bsf_ftf_sidebands: [-1, 0, 1]
    bpfo_harmonics: [1, 2, 3]
    bpfi_harmonics: [1, 2]
    bpfi_shaft_sidebands: [-1, 0, 1]
    tol_orders: 0.02
    bg_halfwidth_orders: 0.3
